services:

  nodeapp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: three-tier-node-app

    ports:
      - "3000:3000"

    environment:
      PORT: 3000

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3